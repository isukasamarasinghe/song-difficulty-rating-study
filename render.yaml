services:
  - type: web
    name: song-difficulty-rating-study
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: SECRET_KEY
        generateValue: true
      - key: INVITE_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATA_ROOT
        value: /var/data
      - key: AUDIO_DIR
        value: /var/data/audio
    disk:
      name: rating-study-data
      mountPath: /var/data
      sizeGB: 1
